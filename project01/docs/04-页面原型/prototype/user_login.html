<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 文图互转主题设计系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-deep: #0b0f19;
  --bg-surface: #141824;
  --bg-elevated: #1c2133;
  --border-color: #2a3045;
  --border-hover: #3d4560;
  --primary: #6366f1;
  --primary-light: #818cf8;
  --primary-glow: rgba(99,102,241,0.3);
  --accent: #22d3ee;
  --accent-glow: rgba(34,211,238,0.2);
  --text-primary: #f1f5f9;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
}
.login-scene {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.12) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(34,211,238,0.08) 0%, transparent 50%),
              radial-gradient(ellipse at 50% 80%, rgba(139,92,246,0.06) 0%, transparent 50%),
              var(--bg-deep);
}
.orb {
  position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.4;
  animation: orbFloat 20s ease-in-out infinite;
}
.orb-1 { width:400px; height:400px; background:rgba(99,102,241,0.3); top:-10%; left:-5%; animation-delay:0s; }
.orb-2 { width:300px; height:300px; background:rgba(34,211,238,0.2); bottom:-5%; right:-5%; animation-delay:-7s; }
.orb-3 { width:200px; height:200px; background:rgba(139,92,246,0.25); top:60%; left:60%; animation-delay:-14s; }
@keyframes orbFloat {
  0%,100% { transform: translate(0,0) scale(1); }
  25% { transform: translate(30px,-40px) scale(1.05); }
  50% { transform: translate(-20px,30px) scale(0.95); }
  75% { transform: translate(40px,20px) scale(1.02); }
}
.grid-bg {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}
.login-card {
  position: relative; z-index: 10;
  width: 440px; max-width: 92vw;
  background: rgba(20,24,36,0.85);
  backdrop-filter: blur(24px) saturate(1.2);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 48px 40px;
  box-shadow: 0 0 80px rgba(99,102,241,0.08), 0 20px 60px rgba(0,0,0,0.4);
  animation: cardIn 0.6s cubic-bezier(0.16,1,0.3,1) both;
}
@keyframes cardIn {
  from { opacity:0; transform: translateY(30px) scale(0.96); }
  to { opacity:1; transform: translateY(0) scale(1); }
}
.brand {
  text-align: center; margin-bottom: 36px;
}
.brand-icon {
  width: 56px; height: 56px; margin: 0 auto 16px;
  background: linear-gradient(135deg, var(--primary), var(--accent));
  border-radius: 16px; display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff;
  box-shadow: 0 8px 32px var(--primary-glow);
  animation: iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse {
  0%,100% { box-shadow: 0 8px 32px var(--primary-glow); }
  50% { box-shadow: 0 8px 48px rgba(99,102,241,0.5); }
}
.brand h1 {
  font-family: 'Sora', sans-serif;
  font-size: 22px; font-weight: 600;
  background: linear-gradient(135deg, var(--text-primary), var(--primary-light));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}
.brand p {
  color: var(--text-muted); font-size: 13px; margin-top: 6px;
}
.form-group { margin-bottom: 20px; }
.form-label {
  display: block; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); margin-bottom: 8px;
}
.form-input-wrap {
  position: relative;
}
.form-input-wrap i {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--text-muted); font-size: 14px; transition: color 0.2s;
}
.form-input {
  width: 100%; height: 46px; padding: 0 14px 0 42px;
  background: var(--bg-elevated); border: 1px solid var(--border-color);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-size: 14px; font-family: inherit;
  transition: all 0.25s ease;
  outline: none;
}
.form-input::placeholder { color: var(--text-muted); }
.form-input:hover { border-color: var(--border-hover); }
.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.form-input:focus + i,
.form-input:focus ~ i { color: var(--primary-light); }
.form-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 24px;
}
.remember-me {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 13px; color: var(--text-secondary);
}
.remember-me input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--primary);
  cursor: pointer;
}
.forgot-link {
  font-size: 13px; color: var(--primary-light);
  text-decoration: none; transition: color 0.2s;
}
.forgot-link:hover { color: var(--accent); }
.btn-primary {
  width: 100%; height: 46px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  border: none; border-radius: var(--radius-sm);
  color: #fff; font-size: 15px; font-weight: 600;
  font-family: inherit; cursor: pointer;
  transition: all 0.3s ease;
  position: relative; overflow: hidden;
}
.btn-primary::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, #7c3aed, var(--accent));
  opacity: 0; transition: opacity 0.3s;
}
.btn-primary:hover::before { opacity: 1; }
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 8px 32px var(--primary-glow);
}
.btn-primary:active { transform: translateY(0); }
.btn-primary span { position: relative; z-index: 1; }
.divider {
  display: flex; align-items: center; gap: 16px;
  margin: 28px 0; color: var(--text-muted); font-size: 12px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border-color);
}
.register-link {
  text-align: center; font-size: 13px; color: var(--text-secondary);
}
.register-link a {
  color: var(--primary-light); text-decoration: none;
  font-weight: 500; transition: color 0.2s;
}
.register-link a:hover { color: var(--accent); }
.particles {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
}
.particle {
  position: absolute; width: 2px; height: 2px;
  background: var(--primary-light); border-radius: 50%;
  animation: particleRise linear infinite;
  opacity: 0;
}
@keyframes particleRise {
  0% { opacity:0; transform: translateY(0) scale(0); }
  10% { opacity:0.6; }
  90% { opacity:0.1; }
  100% { opacity:0; transform: translateY(-100vh) scale(1); }
}
@media (max-width: 480px) {
  .login-card { padding: 36px 24px; }
  .brand h1 { font-size: 18px; }
}
</style>
</head>
<body>
<div id="app">
  <div class="login-scene">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-bg"></div>
    <div class="particles">
      <div class="particle" v-for="n in 20" :key="n"
        :style="{
          left: Math.random()*100 + '%',
          bottom: '-10px',
          width: (1+Math.random()*2) + 'px',
          height: (1+Math.random()*2) + 'px',
          animationDuration: (6+Math.random()*10) + 's',
          animationDelay: Math.random()*8 + 's',
          background: n%3===0 ? 'var(--accent)' : 'var(--primary-light)'
        }"></div>
    </div>

    <div class="login-card">
      <div class="brand">
        <div class="brand-icon"><i class="fas fa-wand-magic-sparkles"></i></div>
        <h1>文图互转主题设计系统</h1>
        <p>创意可复用，风格可积累</p>
      </div>

      <form @submit.prevent="handleLogin">
        <div class="form-group">
          <label class="form-label">邮箱地址</label>
          <div class="form-input-wrap">
            <input type="email" class="form-input" v-model="form.email"
              placeholder="请输入邮箱" required autocomplete="email">
            <i class="fas fa-envelope"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">登录密码</label>
          <div class="form-input-wrap">
            <input :type="showPwd ? 'text' : 'password'" class="form-input"
              v-model="form.password" placeholder="请输入密码" required
              autocomplete="current-password" style="padding-right:42px">
            <i class="fas fa-lock"></i>
            <i :class="showPwd ? 'fas fa-eye' : 'fas fa-eye-slash'"
              @click="showPwd=!showPwd"
              style="left:auto;right:14px;cursor:pointer;z-index:2"></i>
          </div>
        </div>

        <div class="form-row">
          <label class="remember-me">
            <input type="checkbox" v-model="form.remember"> 记住登录
          </label>
          <a href="user_password.html" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="btn-primary" :disabled="loading">
          <span>{{ loading ? '登录中...' : '登 录' }}</span>
        </button>
      </form>

      <div class="divider">其他方式</div>

      <div class="register-link">
        还没有账号？<a href="user_register.html">立即注册</a>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.0/dist/index.full.min.js"></script>
<script>
const { createApp, ref, reactive } = Vue;
createApp({
  setup() {
    const form = reactive({ email: '', password: '', remember: false });
    const showPwd = ref(false);
    const loading = ref(false);

    const handleLogin = () => {
      if (!form.email || !form.password) {
        ElementPlus.ElMessage.warning('请填写邮箱和密码');
        return;
      }
      loading.value = true;
      setTimeout(() => {
        loading.value = false;
        ElementPlus.ElMessage.success('登录成功，正在跳转...');
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      }, 1200);
    };

    return { form, showPwd, loading, handleLogin };
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
