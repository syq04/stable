<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图生文 - 文图互转主题设计系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg-deep:#0b0f19;--bg-surface:#141824;--bg-elevated:#1c2133;--bg-hover:#232840;--border-color:#2a3045;--border-hover:#3d4560;--primary:#6366f1;--primary-light:#818cf8;--primary-glow:rgba(99,102,241,0.25);--accent:#22d3ee;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--sidebar-w:260px;--header-h:64px;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;left:0;top:0;background:linear-gradient(180deg,#0e1322,#111729);border-right:1px solid var(--border-color);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-color);flex-shrink:0}
.sidebar-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.sidebar-brand h2{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;white-space:nowrap}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{color:var(--text-primary);background:var(--bg-elevated)}
.nav-item.active{color:var(--primary-light);background:rgba(99,102,241,0.1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-color);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .2s}
.sidebar-user:hover{background:var(--bg-elevated)}
.sidebar-user .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user .name{font-size:13px;font-weight:500}
.sidebar-user .role{font-size:11px;color:var(--text-muted)}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh}
.header{height:var(--header-h);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(11,15,25,0.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color)}
.header-left{display:flex;align-items:center;gap:16px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:16px;cursor:pointer;align-items:center;justify-content:center}
.header-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:38px;height:38px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header-btn:hover{color:var(--text-primary);border-color:var(--border-hover)}
.content{padding:28px}
.gen-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;min-height:calc(100vh - var(--header-h) - 56px)}
.gen-panel{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.panel-header{padding:18px 22px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between}
.panel-header h3{font-family:'Sora',sans-serif;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-header h3 i{color:var(--accent);font-size:14px}
.panel-body{padding:22px;flex:1;overflow-y:auto}
.upload-zone{border:2px dashed var(--border-color);border-radius:var(--radius);padding:48px 24px;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.upload-zone:hover{border-color:var(--primary);background:rgba(99,102,241,0.03)}
.upload-zone.dragover{border-color:var(--accent);background:rgba(34,211,238,0.05)}
.upload-zone i.upload-icon{font-size:40px;color:var(--primary-light);margin-bottom:16px;opacity:0.6}
.upload-zone .title{font-size:15px;font-weight:500;margin-bottom:6px}
.upload-zone .hint{font-size:12px;color:var(--text-muted)}
.upload-zone .formats{font-size:11px;color:var(--text-muted);margin-top:8px}
.upload-preview{border-radius:var(--radius);overflow:hidden;border:1px solid var(--border-color);position:relative}
.upload-preview img{width:100%;display:block;max-height:400px;object-fit:contain;background:var(--bg-elevated)}
.upload-preview .change-btn{position:absolute;top:10px;right:10px;height:32px;padding:0 14px;border-radius:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:12px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.upload-preview .change-btn:hover{background:rgba(0,0,0,0.8)}
.btn-analyze{width:100%;height:50px;background:linear-gradient(135deg,var(--accent),#06b6d4);border:none;border-radius:var(--radius-sm);color:#0b0f19;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px}
.btn-analyze:hover{transform:translateY(-1px);box-shadow:0 8px 32px var(--accent-glow,rgba(34,211,238,0.3))}
.btn-analyze:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.result-empty{text-align:center;color:var(--text-muted);padding:60px 20px}
.result-empty i{font-size:48px;margin-bottom:16px;opacity:0.3}
.result-empty p{font-size:14px;margin-bottom:4px}
.result-empty .sub{font-size:12px;opacity:0.6}
.analyzing{text-align:center;padding:40px}
.analyzing .spinner{width:48px;height:48px;border:3px solid var(--border-color);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing p{color:var(--text-secondary);font-size:14px}
.result-content{animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.result-section{margin-bottom:20px}
.result-section .label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.description-box{background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-sm);padding:16px;font-size:14px;line-height:1.8;color:var(--text-primary);position:relative}
.description-box .edit-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:8px;background:var(--bg-surface);border:1px solid var(--border-color);color:var(--text-muted);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.description-box .edit-btn:hover{color:var(--primary-light);border-color:var(--primary)}
.description-box textarea{width:100%;min-height:100px;background:transparent;border:none;color:var(--text-primary);font-size:14px;font-family:inherit;line-height:1.8;outline:none;resize:vertical}
.tags-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:default}
.tag.blue{background:rgba(99,102,241,0.12);color:var(--primary-light)}
.tag.cyan{background:rgba(34,211,238,0.1);color:var(--accent)}
.tag.green{background:rgba(52,211,153,0.1);color:var(--success)}
.tag.amber{background:rgba(251,191,36,0.1);color:var(--warning)}
.result-actions{display:flex;gap:10px;margin-top:20px}
.btn-action{height:40px;padding:0 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;border:1px solid var(--border-color);background:var(--bg-elevated);color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px}
.btn-action:hover{color:var(--text-primary);border-color:var(--border-hover)}
.btn-action.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-action.primary:hover{background:var(--primary-light)}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
@media(max-width:1024px){.gen-layout{grid-template-columns:1fr}}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block}.main{margin-left:0}.menu-toggle{display:flex}.content{padding:16px}}
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <div class="mobile-overlay" :class="{show:sidebarOpen}" @click="sidebarOpen=false"></div>
    <aside class="sidebar" :class="{open:sidebarOpen}">
      <div class="sidebar-brand"><div class="logo"><i class="fas fa-wand-magic-sparkles"></i></div><h2>文图互转设计</h2></div>
      <nav class="sidebar-nav">
        <div class="nav-section"><div class="nav-section-title">概览</div><a class="nav-item" href="dashboard.html"><i class="fas fa-grid-2"></i> 工作台</a></div>
        <div class="nav-section"><div class="nav-section-title">创作</div><a class="nav-item" href="text2image.html"><i class="fas fa-image"></i> 文生图</a><a class="nav-item active" href="image2text.html"><i class="fas fa-font"></i> 图生文</a></div>
        <div class="nav-section"><div class="nav-section-title">管理</div><a class="nav-item" href="style_management.html"><i class="fas fa-palette"></i> 风格管理</a><a class="nav-item" href="lora_training.html"><i class="fas fa-brain"></i> LoRA训练</a></div>
        <div class="nav-section"><div class="nav-section-title">系统</div><a class="nav-item" href="admin_dashboard.html"><i class="fas fa-gauge-high"></i> 系统概览</a><a class="nav-item" href="admin_users.html"><i class="fas fa-users-gear"></i> 用户管理</a><a class="nav-item" href="admin_settings.html"><i class="fas fa-sliders"></i> 系统配置</a><a class="nav-item" href="admin_logs.html"><i class="fas fa-scroll"></i> 日志管理</a><a class="nav-item" href="admin_models.html"><i class="fas fa-cube"></i> 模型管理</a></div>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar">张</div><div class="info"><div class="name">张明远</div><div class="role">系统管理员</div></div></div></div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left"><button class="menu-toggle" @click="sidebarOpen=!sidebarOpen"><i class="fas fa-bars"></i></button><h1 class="header-title">图生文</h1></div>
        <div class="header-right"><a href="image2text_history.html" class="header-btn" title="历史记录"><i class="fas fa-clock-rotate-left"></i></a></div>
      </header>

      <div class="content">
        <div class="gen-layout">
          <div class="gen-panel">
            <div class="panel-header"><h3><i class="fas fa-upload"></i> 上传图像</h3></div>
            <div class="panel-body">
              <div class="upload-zone" v-if="!uploadedImage" @click="triggerUpload" @dragover.prevent="dragover=true" @dragleave="dragover=false" @drop.prevent="handleDrop" :class="{dragover}">
                <i class="fas fa-cloud-arrow-up upload-icon"></i>
                <div class="title">拖拽图像到此处，或点击上传</div>
                <div class="hint">支持 JPG、PNG、WebP 格式，最大 10MB</div>
                <div class="formats">AI将分析图像内容并生成文字描述</div>
                <input type="file" ref="fileInput" accept="image/*" @change="handleFile" style="display:none">
              </div>
              <div v-else>
                <div class="upload-preview">
                  <div style="width:100%;height:300px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm)">
                    <div style="text-align:center">
                      <i class="fas fa-image" style="font-size:64px;color:var(--accent);opacity:0.3"></i>
                      <p style="margin-top:12px;color:var(--text-muted);font-size:13px">已上传图像预览</p>
                    </div>
                  </div>
                  <button class="change-btn" @click="changeImage"><i class="fas fa-arrows-rotate"></i> 更换</button>
                </div>
                <button class="btn-analyze" @click="analyze" :disabled="analyzing">
                  <i class="fas fa-magnifying-glass-chart"></i> {{ analyzing?'分析中...':'开始分析' }}
                </button>
              </div>
            </div>
          </div>

          <div class="gen-panel">
            <div class="panel-header"><h3><i class="fas fa-file-lines"></i> 分析结果</h3></div>
            <div class="panel-body">
              <div class="result-empty" v-if="!analyzing&&!result">
                <i class="fas fa-wand-magic-sparkles"></i>
                <p>上传图像开始分析</p>
                <div class="sub">AI将识别图像内容并生成描述</div>
              </div>
              <div class="analyzing" v-if="analyzing">
                <div class="spinner"></div>
                <p>正在分析图像内容...</p>
              </div>
              <div class="result-content" v-if="!analyzing&&result">
                <div class="result-section">
                  <div class="label">图像描述</div>
                  <div class="description-box">
                    <textarea v-if="editing" v-model="result.description"></textarea>
                    <p v-else>{{ result.description }}</p>
                    <button class="edit-btn" @click="editing=!editing">
                      <i :class="editing?'fas fa-check':'fas fa-pen'"></i>
                    </button>
                  </div>
                </div>
                <div class="result-section">
                  <div class="label">识别标签</div>
                  <div class="tags-wrap">
                    <span class="tag" v-for="(tag,i) in result.tags" :key="i"
                      :class="['blue','cyan','green','amber'][i%4]">{{ tag }}</span>
                  </div>
                </div>
                <div class="result-actions">
                  <button class="btn-action primary" @click="saveResult"><i class="fas fa-floppy-disk"></i> 保存</button>
                  <button class="btn-action"><i class="fas fa-copy"></i> 复制描述</button>
                  <button class="btn-action"><i class="fas fa-arrow-right-to-bracket"></i> 用于文生图</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.0/dist/index.full.min.js"></script>
<script>
const{createApp,ref,reactive}=Vue;
createApp({
  setup(){
    const sidebarOpen=ref(false);
    const uploadedImage=ref(null);
    const analyzing=ref(false);
    const editing=ref(false);
    const result=ref(null);
    const dragover=ref(false);
    const fileInput=ref(null);

    const triggerUpload=()=>{fileInput.value.click();};
    const handleFile=(e)=>{
      const f=e.target.files[0];
      if(f){uploadedImage.value=f.name;ElementPlus.ElMessage.success('图像已上传：'+f.name);}
    };
    const handleDrop=(e)=>{
      dragover.value=false;
      const f=e.dataTransfer.files[0];
      if(f&&f.type.startsWith('image/')){uploadedImage.value=f.name;ElementPlus.ElMessage.success('图像已上传：'+f.name);}
    };
    const changeImage=()=>{uploadedImage.value=null;result.value=null;editing.value=false;};

    const analyze=()=>{
      analyzing.value=true;
      setTimeout(()=>{
        analyzing.value=false;
        result.value={
          description:'这是一张展示城市夜景的照片，画面中高楼大厦林立，霓虹灯光映照在湿润的路面上，营造出梦幻般的氛围。前景中可以看到行人撑着雨伞走过斑马线，远处的天际线被暖色调的灯光勾勒出轮廓。整体色调偏冷，以蓝色和紫色为主，点缀着橙色和黄色的灯光。',
          tags:['城市','夜景','霓虹灯','建筑','雨天','行人','天际线','灯光']
        };
        ElementPlus.ElMessage.success('分析完成！');
      },2000);
    };

    const saveResult=()=>{
      ElementPlus.ElMessage.success('分析结果已保存');
      editing.value=false;
    };

    return{sidebarOpen,uploadedImage,analyzing,editing,result,dragover,fileInput,triggerUpload,handleFile,handleDrop,changeImage,analyze,saveResult};
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
