<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 - 文图互转主题设计系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg-deep:#0b0f19;--bg-surface:#141824;--bg-elevated:#1c2133;--bg-hover:#232840;--border-color:#2a3045;--border-hover:#3d4560;--primary:#6366f1;--primary-light:#818cf8;--primary-glow:rgba(99,102,241,0.25);--accent:#22d3ee;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--success:#34d399;--danger:#f87171;--sidebar-w:260px;--header-h:64px;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;left:0;top:0;background:linear-gradient(180deg,#0e1322,#111729);border-right:1px solid var(--border-color);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-color);flex-shrink:0}
.sidebar-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.sidebar-brand h2{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;color:var(--text-primary);white-space:nowrap}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{color:var(--text-primary);background:var(--bg-elevated)}
.nav-item.active{color:var(--primary-light);background:rgba(99,102,241,0.1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-color);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .2s}
.sidebar-user:hover{background:var(--bg-elevated)}
.sidebar-user .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user .name{font-size:13px;font-weight:500;color:var(--text-primary)}
.sidebar-user .role{font-size:11px;color:var(--text-muted)}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh}
.header{height:var(--header-h);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(11,15,25,0.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color)}
.header-left{display:flex;align-items:center;gap:16px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:16px;cursor:pointer;align-items:center;justify-content:center}
.header-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:38px;height:38px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header-btn:hover{color:var(--text-primary);border-color:var(--border-hover)}
.content{padding:28px}
.page-desc{color:var(--text-secondary);font-size:14px;margin-bottom:28px}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-color)}
.card-header h3{font-family:'Sora',sans-serif;font-size:15px;font-weight:600}
.card-body{padding:24px}
.form-section{max-width:520px}
.form-group{margin-bottom:22px}
.form-label{display:block;font-size:13px;font-weight:500;color:var(--text-secondary);margin-bottom:8px}
.form-input-wrap{position:relative}
.form-input-wrap>i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:14px;transition:color .2s;z-index:1}
.form-input{width:100%;height:46px;padding:0 14px 0 42px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:14px;font-family:inherit;transition:all .25s;outline:none}
.form-input::placeholder{color:var(--text-muted)}
.form-input:hover{border-color:var(--border-hover)}
.form-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.form-input:focus~i{color:var(--primary-light)}
.form-hint{font-size:12px;color:var(--text-muted);margin-top:6px}
.btn-row{display:flex;gap:12px;margin-top:32px}
.btn{height:44px;padding:0 28px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .25s;border:none;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;position:relative;overflow:hidden}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,#7c3aed,var(--accent));opacity:0;transition:opacity .3s}
.btn-primary:hover::before{opacity:1}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--primary-glow)}
.btn-primary span{position:relative;z-index:1}
.btn-ghost{background:transparent;color:var(--text-secondary);border:1px solid var(--border-color)}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--border-hover);background:var(--bg-elevated)}
.profile-section{display:flex;gap:28px;margin-bottom:32px;padding-bottom:28px;border-bottom:1px solid var(--border-color)}
.profile-avatar{width:80px;height:80px;border-radius:20px;background:linear-gradient(135deg,var(--primary),#a855f7);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;font-weight:700;flex-shrink:0;position:relative}
.profile-avatar .edit-badge{position:absolute;bottom:-4px;right:-4px;width:26px;height:26px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;color:#0b0f19;cursor:pointer;border:2px solid var(--bg-surface)}
.profile-info{flex:1}
.profile-info .name{font-family:'Sora',sans-serif;font-size:20px;font-weight:600;margin-bottom:4px}
.profile-info .email{color:var(--text-secondary);font-size:14px;margin-bottom:8px}
.profile-info .role-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:6px;font-size:12px;font-weight:500;background:rgba(99,102,241,0.12);color:var(--primary-light)}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block}.main{margin-left:0}.menu-toggle{display:flex}.content{padding:16px}.profile-section{flex-direction:column;align-items:center;text-align:center}}
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <div class="mobile-overlay" :class="{show:sidebarOpen}" @click="sidebarOpen=false"></div>
    <aside class="sidebar" :class="{open:sidebarOpen}">
      <div class="sidebar-brand">
        <div class="logo"><i class="fas fa-wand-magic-sparkles"></i></div>
        <h2>文图互转设计</h2>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">概览</div>
          <a class="nav-item" href="dashboard.html"><i class="fas fa-grid-2"></i> 工作台</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">创作</div>
          <a class="nav-item" href="text2image.html"><i class="fas fa-image"></i> 文生图</a>
          <a class="nav-item" href="image2text.html"><i class="fas fa-font"></i> 图生文</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">管理</div>
          <a class="nav-item" href="style_management.html"><i class="fas fa-palette"></i> 风格管理</a>
          <a class="nav-item" href="lora_training.html"><i class="fas fa-brain"></i> LoRA训练</a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">系统</div>
          <a class="nav-item" href="admin_dashboard.html"><i class="fas fa-gauge-high"></i> 系统概览</a>
          <a class="nav-item" href="admin_users.html"><i class="fas fa-users-gear"></i> 用户管理</a>
          <a class="nav-item" href="admin_settings.html"><i class="fas fa-sliders"></i> 系统配置</a>
          <a class="nav-item" href="admin_logs.html"><i class="fas fa-scroll"></i> 日志管理</a>
          <a class="nav-item" href="admin_models.html"><i class="fas fa-cube"></i> 模型管理</a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar">张</div>
          <div class="info"><div class="name">张明远</div><div class="role">系统管理员</div></div>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" @click="sidebarOpen=!sidebarOpen"><i class="fas fa-bars"></i></button>
          <h1 class="header-title">个人设置</h1>
        </div>
        <div class="header-right">
          <button class="header-btn" title="通知"><i class="fas fa-bell"></i></button>
        </div>
      </header>

      <div class="content">
        <p class="page-desc">管理你的账户信息和安全设置</p>

        <div class="card" style="margin-bottom:20px">
          <div class="card-header"><h3>个人信息</h3></div>
          <div class="card-body">
            <div class="profile-section">
              <div class="profile-avatar">
                张
                <div class="edit-badge"><i class="fas fa-camera"></i></div>
              </div>
              <div class="profile-info">
                <div class="name">张明远</div>
                <div class="email">zhangmy@example.com</div>
                <div class="role-badge"><i class="fas fa-shield-halved"></i> 系统管理员</div>
              </div>
            </div>
            <div class="form-section">
              <div class="form-group">
                <label class="form-label">用户名</label>
                <div class="form-input-wrap">
                  <input type="text" class="form-input" v-model="profile.username" placeholder="输入用户名">
                  <i class="fas fa-user"></i>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">邮箱地址</label>
                <div class="form-input-wrap">
                  <input type="email" class="form-input" v-model="profile.email" placeholder="输入邮箱">
                  <i class="fas fa-envelope"></i>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-primary" @click="saveProfile"><span>保存修改</span></button>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><h3>修改密码</h3></div>
          <div class="card-body">
            <div class="form-section">
              <div class="form-group">
                <label class="form-label">当前密码</label>
                <div class="form-input-wrap">
                  <input type="password" class="form-input" v-model="pwd.oldPassword" placeholder="输入当前密码">
                  <i class="fas fa-lock"></i>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">新密码</label>
                <div class="form-input-wrap">
                  <input type="password" class="form-input" v-model="pwd.newPassword" placeholder="6位以上，含字母和数字">
                  <i class="fas fa-key"></i>
                </div>
                <div class="form-hint">密码长度6-128位，建议包含大小写字母、数字和特殊字符</div>
              </div>
              <div class="form-group">
                <label class="form-label">确认新密码</label>
                <div class="form-input-wrap">
                  <input type="password" class="form-input" v-model="pwd.confirmPassword" placeholder="再次输入新密码">
                  <i class="fas fa-shield-halved"></i>
                </div>
              </div>
              <div class="btn-row">
                <button class="btn btn-primary" @click="changePassword"><span>更新密码</span></button>
                <button class="btn btn-ghost" @click="resetPwdForm">重置</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.0/dist/index.full.min.js"></script>
<script>
const{createApp,ref,reactive}=Vue;
createApp({
  setup(){
    const sidebarOpen=ref(false);
    const profile=reactive({username:'张明远',email:'zhangmy@example.com'});
    const pwd=reactive({oldPassword:'',newPassword:'',confirmPassword:''});
    const saveProfile=()=>{
      ElementPlus.ElMessage.success('个人信息已更新');
    };
    const changePassword=()=>{
      if(!pwd.oldPassword||!pwd.newPassword||!pwd.confirmPassword){
        ElementPlus.ElMessage.warning('请填写所有密码字段');return;
      }
      if(pwd.newPassword!==pwd.confirmPassword){
        ElementPlus.ElMessage.error('两次输入的新密码不一致');return;
      }
      if(pwd.newPassword.length<6){
        ElementPlus.ElMessage.error('新密码长度不能少于6位');return;
      }
      ElementPlus.ElMessage.success('密码修改成功，请重新登录');
      setTimeout(()=>{window.location.href='user_login.html';},1200);
    };
    const resetPwdForm=()=>{pwd.oldPassword='';pwd.newPassword='';pwd.confirmPassword='';};
    return{sidebarOpen,profile,pwd,saveProfile,changePassword,resetPwdForm};
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
