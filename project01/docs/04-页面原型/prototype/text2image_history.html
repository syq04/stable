<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文生图历史 - 文图互转主题设计系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg-deep:#0b0f19;--bg-surface:#141824;--bg-elevated:#1c2133;--bg-hover:#232840;--border-color:#2a3045;--border-hover:#3d4560;--primary:#6366f1;--primary-light:#818cf8;--primary-glow:rgba(99,102,241,0.25);--accent:#22d3ee;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--sidebar-w:260px;--header-h:64px;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;left:0;top:0;background:linear-gradient(180deg,#0e1322,#111729);border-right:1px solid var(--border-color);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-color);flex-shrink:0}
.sidebar-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.sidebar-brand h2{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;white-space:nowrap}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{color:var(--text-primary);background:var(--bg-elevated)}
.nav-item.active{color:var(--primary-light);background:rgba(99,102,241,0.1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-color);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .2s}
.sidebar-user:hover{background:var(--bg-elevated)}
.sidebar-user .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user .name{font-size:13px;font-weight:500}
.sidebar-user .role{font-size:11px;color:var(--text-muted)}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh}
.header{height:var(--header-h);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(11,15,25,0.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color)}
.header-left{display:flex;align-items:center;gap:16px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:16px;cursor:pointer;align-items:center;justify-content:center}
.header-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:38px;height:38px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header-btn:hover{color:var(--text-primary);border-color:var(--border-hover)}
.content{padding:28px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.toolbar-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-box{position:relative}
.search-box input{width:240px;height:40px;padding:0 14px 0 38px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;transition:all .25s}
.search-box input::placeholder{color:var(--text-muted)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px}
.filter-select{height:40px;padding:0 12px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;cursor:pointer;min-width:120px}
.filter-select option{background:var(--bg-surface)}
.btn{height:40px;padding:0 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .25s;border:none;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px var(--primary-glow)}
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.history-card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden;transition:all .25s;cursor:pointer}
.history-card:hover{border-color:var(--border-hover);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.25)}
.history-card .thumb{height:180px;position:relative;overflow:hidden}
.history-card .thumb .placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.history-card .thumb .status-badge{position:absolute;top:10px;right:10px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.status-badge.success{background:rgba(52,211,153,0.2);color:var(--success)}
.status-badge.failed{background:rgba(248,113,113,0.2);color:var(--danger)}
.status-badge.pending{background:rgba(251,191,36,0.2);color:var(--warning)}
.history-card .info{padding:14px 16px}
.history-card .info .prompt{font-size:13px;font-weight:500;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.history-card .info .meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-muted)}
.history-card .info .meta .style-tag{padding:2px 8px;border-radius:4px;background:rgba(99,102,241,0.1);color:var(--primary-light);font-weight:500}
.history-card .actions{display:flex;border-top:1px solid var(--border-color)}
.history-card .actions button{flex:1;height:38px;background:transparent;border:none;color:var(--text-muted);font-size:12px;font-family:inherit;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.history-card .actions button:hover{color:var(--text-primary);background:var(--bg-elevated)}
.history-card .actions button+button{border-left:1px solid var(--border-color)}
.pagination{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:24px}
.page-btn{width:36px;height:36px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.page-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state i{font-size:48px;margin-bottom:16px;opacity:0.3}
.empty-state p{font-size:14px;margin-bottom:8px}
.empty-state .sub{font-size:12px;opacity:0.6}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block}.main{margin-left:0}.menu-toggle{display:flex}.content{padding:16px}.history-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <div class="mobile-overlay" :class="{show:sidebarOpen}" @click="sidebarOpen=false"></div>
    <aside class="sidebar" :class="{open:sidebarOpen}">
      <div class="sidebar-brand"><div class="logo"><i class="fas fa-wand-magic-sparkles"></i></div><h2>文图互转设计</h2></div>
      <nav class="sidebar-nav">
        <div class="nav-section"><div class="nav-section-title">概览</div><a class="nav-item" href="dashboard.html"><i class="fas fa-grid-2"></i> 工作台</a></div>
        <div class="nav-section"><div class="nav-section-title">创作</div><a class="nav-item active" href="text2image.html"><i class="fas fa-image"></i> 文生图</a><a class="nav-item" href="image2text.html"><i class="fas fa-font"></i> 图生文</a></div>
        <div class="nav-section"><div class="nav-section-title">管理</div><a class="nav-item" href="style_management.html"><i class="fas fa-palette"></i> 风格管理</a><a class="nav-item" href="lora_training.html"><i class="fas fa-brain"></i> LoRA训练</a></div>
        <div class="nav-section"><div class="nav-section-title">系统</div><a class="nav-item" href="admin_dashboard.html"><i class="fas fa-gauge-high"></i> 系统概览</a><a class="nav-item" href="admin_users.html"><i class="fas fa-users-gear"></i> 用户管理</a><a class="nav-item" href="admin_settings.html"><i class="fas fa-sliders"></i> 系统配置</a><a class="nav-item" href="admin_logs.html"><i class="fas fa-scroll"></i> 日志管理</a><a class="nav-item" href="admin_models.html"><i class="fas fa-cube"></i> 模型管理</a></div>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar">张</div><div class="info"><div class="name">张明远</div><div class="role">系统管理员</div></div></div></div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left"><button class="menu-toggle" @click="sidebarOpen=!sidebarOpen"><i class="fas fa-bars"></i></button><h1 class="header-title">文生图历史</h1></div>
        <div class="header-right"><a href="text2image.html" class="header-btn" title="新建生成"><i class="fas fa-plus"></i></a></div>
      </header>

      <div class="content">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-box"><i class="fas fa-search"></i><input v-model="keyword" placeholder="搜索提示词..."></div>
            <select class="filter-select" v-model="statusFilter">
              <option value="">全部状态</option>
              <option value="SUCCESS">成功</option>
              <option value="FAILED">失败</option>
              <option value="PENDING">生成中</option>
            </select>
          </div>
          <span style="font-size:13px;color:var(--text-muted)">共 {{ filtered.length }} 条记录</span>
        </div>

        <div class="history-grid" v-if="filtered.length">
          <div class="history-card" v-for="item in filtered" :key="item.id">
            <div class="thumb">
              <div class="placeholder" :style="{background:item.gradient}">
                <i class="fas fa-image" style="font-size:32px;color:rgba(255,255,255,0.2)"></i>
              </div>
              <span class="status-badge" :class="item.status.toLowerCase()">{{ statusLabel(item.status) }}</span>
            </div>
            <div class="info">
              <div class="prompt">{{ item.prompt }}</div>
              <div class="meta">
                <span class="style-tag">{{ item.styleName }}</span>
                <span>{{ item.createdAt }}</span>
              </div>
            </div>
            <div class="actions">
              <button @click="viewDetail(item)"><i class="fas fa-eye"></i> 详情</button>
              <button @click="download(item)"><i class="fas fa-download"></i> 下载</button>
              <button @click="confirmDelete(item)"><i class="fas fa-trash"></i> 删除</button>
            </div>
          </div>
        </div>

        <div class="empty-state" v-else>
          <i class="fas fa-image"></i>
          <p>暂无生成记录</p>
          <div class="sub">前往文生图页面开始创作</div>
        </div>

        <div class="pagination" v-if="filtered.length">
          <button class="page-btn"><i class="fas fa-chevron-left"></i></button>
          <button class="page-btn active">1</button>
          <button class="page-btn">2</button>
          <button class="page-btn">3</button>
          <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.0/dist/index.full.min.js"></script>
<script>
const{createApp,ref,reactive,computed}=Vue;
createApp({
  setup(){
    const sidebarOpen=ref(false);
    const keyword=ref('');
    const statusFilter=ref('');
    const records=reactive([
      {id:1,prompt:'一只穿着宇航服的猫咪站在月球表面，背景是蓝色地球，赛博朋克风格',styleName:'赛博朋克',status:'SUCCESS',gradient:'linear-gradient(135deg,#6366f1,#ec4899)',createdAt:'2026-05-10 14:32'},
      {id:2,prompt:'江南水乡古镇，烟雨朦胧，小桥流水人家，水墨画风格',styleName:'水墨丹青',status:'SUCCESS',gradient:'linear-gradient(135deg,#1e293b,#475569)',createdAt:'2026-05-10 13:15'},
      {id:3,prompt:'未来城市天际线，霓虹灯光，飞行汽车，高楼大厦',styleName:'赛博朋克',status:'SUCCESS',gradient:'linear-gradient(135deg,#6366f1,#ec4899)',createdAt:'2026-05-10 11:48'},
      {id:4,prompt:'产品展示图，白色背景，高端手机，专业灯光',styleName:'电商白底',status:'FAILED',gradient:'linear-gradient(135deg,#e2e8f0,#f8fafc)',createdAt:'2026-05-09 16:22'},
      {id:5,prompt:'春天樱花树下的日式庭院，和风建筑，清新自然',styleName:'日系清新',status:'SUCCESS',gradient:'linear-gradient(135deg,#f472b6,#fbbf24)',createdAt:'2026-05-09 10:05'},
      {id:6,prompt:'古典油画风格的静物，水果和酒杯，暖色调',styleName:'油画质感',status:'PENDING',gradient:'linear-gradient(135deg,#92400e,#b45309)',createdAt:'2026-05-09 09:30'},
      {id:7,prompt:'写实风格的雪山日出，金色阳光洒在雪峰上',styleName:'写实风格',status:'SUCCESS',gradient:'linear-gradient(135deg,#059669,#0d9488)',createdAt:'2026-05-08 15:18'},
      {id:8,prompt:'赛博朋克风格的地下城市场景，雨水倒映霓虹灯',styleName:'赛博朋克',status:'SUCCESS',gradient:'linear-gradient(135deg,#6366f1,#ec4899)',createdAt:'2026-05-08 12:40'}
    ]);
    const filtered=computed(()=>records.filter(r=>{
      const mk=!keyword.value||r.prompt.includes(keyword.value);
      const ms=!statusFilter.value||r.status===statusFilter.value;
      return mk&&ms;
    }));
    const statusLabel=(s)=>({SUCCESS:'成功',FAILED:'失败',PENDING:'生成中'}[s]||s);
    const viewDetail=(item)=>{ElementPlus.ElMessage.info('查看详情：'+item.prompt.substring(0,20)+'...');};
    const download=(item)=>{ElementPlus.ElMessage.success('开始下载');};
    const confirmDelete=(item)=>{
      ElementPlus.ElMessageBox.confirm('确定删除这条生成记录吗？','删除确认',{confirmButtonText:'删除',cancelButtonText:'取消',type:'warning'}).then(()=>{
        const idx=records.findIndex(x=>x.id===item.id);
        if(idx>-1)records.splice(idx,1);
        ElementPlus.ElMessage.success('已删除');
      }).catch(()=>{});
    };
    return{sidebarOpen,keyword,statusFilter,records,filtered,statusLabel,viewDetail,download,confirmDelete};
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
