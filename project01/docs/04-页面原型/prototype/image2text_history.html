<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图生文历史 - 文图互转主题设计系统</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/element-plus@2.7.0/dist/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg-deep:#0b0f19;--bg-surface:#141824;--bg-elevated:#1c2133;--bg-hover:#232840;--border-color:#2a3045;--border-hover:#3d4560;--primary:#6366f1;--primary-light:#818cf8;--primary-glow:rgba(99,102,241,0.25);--accent:#22d3ee;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--success:#34d399;--warning:#fbbf24;--danger:#f87171;--sidebar-w:260px;--header-h:64px;--radius:12px;--radius-sm:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);min-height:100vh}
.layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;left:0;top:0;background:linear-gradient(180deg,#0e1322,#111729);border-right:1px solid var(--border-color);display:flex;flex-direction:column;z-index:100;transition:transform .3s}
.sidebar-brand{height:var(--header-h);display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--border-color);flex-shrink:0}
.sidebar-brand .logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;flex-shrink:0}
.sidebar-brand h2{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;white-space:nowrap}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px}
.nav-section{margin-bottom:8px}
.nav-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);padding:8px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .2s;margin-bottom:2px;position:relative}
.nav-item i{width:18px;text-align:center;font-size:14px}
.nav-item:hover{color:var(--text-primary);background:var(--bg-elevated)}
.nav-item.active{color:var(--primary-light);background:rgba(99,102,241,0.1)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--primary);border-radius:0 3px 3px 0}
.sidebar-footer{padding:16px;border-top:1px solid var(--border-color);flex-shrink:0}
.sidebar-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--radius-sm);cursor:pointer;transition:background .2s}
.sidebar-user:hover{background:var(--bg-elevated)}
.sidebar-user .avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#a855f7);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;font-weight:600}
.sidebar-user .info{flex:1;min-width:0}
.sidebar-user .name{font-size:13px;font-weight:500}
.sidebar-user .role{font-size:11px;color:var(--text-muted)}
.main{flex:1;margin-left:var(--sidebar-w);min-height:100vh}
.header{height:var(--header-h);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(11,15,25,0.8);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-color)}
.header-left{display:flex;align-items:center;gap:16px}
.menu-toggle{display:none;width:36px;height:36px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:16px;cursor:pointer;align-items:center;justify-content:center}
.header-title{font-family:'Sora',sans-serif;font-size:18px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.header-btn{width:38px;height:38px;border-radius:10px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.header-btn:hover{color:var(--text-primary);border-color:var(--border-hover)}
.content{padding:28px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px}
.toolbar-left{display:flex;align-items:center;gap:12px}
.search-box{position:relative}
.search-box input{width:240px;height:40px;padding:0 14px 0 38px;background:var(--bg-elevated);border:1px solid var(--border-color);border-radius:var(--radius-sm);color:var(--text-primary);font-size:13px;font-family:inherit;outline:none;transition:all .25s}
.search-box input::placeholder{color:var(--text-muted)}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow)}
.search-box i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:13px}
.card{background:var(--bg-surface);border:1px solid var(--border-color);border-radius:var(--radius);overflow:hidden}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
thead{background:var(--bg-elevated)}
th{padding:14px 18px;text-align:left;font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border-color)}
td{padding:14px 18px;font-size:13px;border-bottom:1px solid rgba(42,48,69,0.5);vertical-align:top}
tr:hover td{background:rgba(34,211,238,0.02)}
.desc-cell{max-width:360px}
.desc-cell .text{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}
.tags-cell{display:flex;flex-wrap:wrap;gap:4px}
.mini-tag{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500;background:rgba(34,211,238,0.1);color:var(--accent)}
.status-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.status-badge.success{background:rgba(52,211,153,0.15);color:var(--success)}
.status-badge.failed{background:rgba(248,113,113,0.15);color:var(--danger)}
.actions{display:flex;gap:6px}
.btn-sm{height:32px;padding:0 12px;border-radius:6px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .2s;border:1px solid var(--border-color);background:var(--bg-elevated);color:var(--text-secondary);display:inline-flex;align-items:center;gap:5px}
.btn-sm:hover{color:var(--text-primary);border-color:var(--border-hover)}
.btn-sm.danger{color:var(--danger);border-color:rgba(248,113,113,0.2)}
.btn-sm.danger:hover{background:rgba(248,113,113,0.1)}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-top:1px solid var(--border-color)}
.pagination .info{font-size:12px;color:var(--text-muted)}
.pagination .pages{display:flex;gap:4px}
.page-btn{width:34px;height:34px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border-color);color:var(--text-secondary);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.page-btn:hover{border-color:var(--border-hover);color:var(--text-primary)}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99}
@media(max-width:768px){.sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.mobile-overlay.show{display:block}.main{margin-left:0}.menu-toggle{display:flex}.content{padding:16px}}
</style>
</head>
<body>
<div id="app">
  <div class="layout">
    <div class="mobile-overlay" :class="{show:sidebarOpen}" @click="sidebarOpen=false"></div>
    <aside class="sidebar" :class="{open:sidebarOpen}">
      <div class="sidebar-brand"><div class="logo"><i class="fas fa-wand-magic-sparkles"></i></div><h2>文图互转设计</h2></div>
      <nav class="sidebar-nav">
        <div class="nav-section"><div class="nav-section-title">概览</div><a class="nav-item" href="dashboard.html"><i class="fas fa-grid-2"></i> 工作台</a></div>
        <div class="nav-section"><div class="nav-section-title">创作</div><a class="nav-item" href="text2image.html"><i class="fas fa-image"></i> 文生图</a><a class="nav-item active" href="image2text.html"><i class="fas fa-font"></i> 图生文</a></div>
        <div class="nav-section"><div class="nav-section-title">管理</div><a class="nav-item" href="style_management.html"><i class="fas fa-palette"></i> 风格管理</a><a class="nav-item" href="lora_training.html"><i class="fas fa-brain"></i> LoRA训练</a></div>
        <div class="nav-section"><div class="nav-section-title">系统</div><a class="nav-item" href="admin_dashboard.html"><i class="fas fa-gauge-high"></i> 系统概览</a><a class="nav-item" href="admin_users.html"><i class="fas fa-users-gear"></i> 用户管理</a><a class="nav-item" href="admin_settings.html"><i class="fas fa-sliders"></i> 系统配置</a><a class="nav-item" href="admin_logs.html"><i class="fas fa-scroll"></i> 日志管理</a><a class="nav-item" href="admin_models.html"><i class="fas fa-cube"></i> 模型管理</a></div>
      </nav>
      <div class="sidebar-footer"><div class="sidebar-user"><div class="avatar">张</div><div class="info"><div class="name">张明远</div><div class="role">系统管理员</div></div></div></div>
    </aside>

    <div class="main">
      <header class="header">
        <div class="header-left"><button class="menu-toggle" @click="sidebarOpen=!sidebarOpen"><i class="fas fa-bars"></i></button><h1 class="header-title">图生文历史</h1></div>
        <div class="header-right"><a href="image2text.html" class="header-btn" title="新建分析"><i class="fas fa-plus"></i></a></div>
      </header>

      <div class="content">
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-box"><i class="fas fa-search"></i><input v-model="keyword" placeholder="搜索描述内容..."></div>
          </div>
          <span style="font-size:13px;color:var(--text-muted)">共 {{ filtered.length }} 条记录</span>
        </div>

        <div class="card">
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>描述内容</th><th>标签</th><th>状态</th><th>分析时间</th><th>操作</th></tr>
              </thead>
              <tbody>
                <tr v-for="r in filtered" :key="r.id">
                  <td><div class="desc-cell"><div class="text">{{ r.description }}</div></div></td>
                  <td><div class="tags-cell"><span class="mini-tag" v-for="t in r.tags.slice(0,3)" :key="t">{{ t }}</span><span v-if="r.tags.length>3" style="font-size:11px;color:var(--text-muted)">+{{ r.tags.length-3 }}</span></div></td>
                  <td><span class="status-badge" :class="r.status.toLowerCase()">{{ r.status==='SUCCESS'?'成功':'失败' }}</span></td>
                  <td style="white-space:nowrap">{{ r.createdAt }}</td>
                  <td><div class="actions">
                    <button class="btn-sm" @click="viewDetail(r)"><i class="fas fa-eye"></i></button>
                    <button class="btn-sm" @click="editDesc(r)"><i class="fas fa-pen"></i></button>
                    <button class="btn-sm danger" @click="confirmDelete(r)"><i class="fas fa-trash"></i></button>
                  </div></td>
                </tr>
              </tbody>
            </table>
          </div>
          <div class="pagination">
            <div class="info">共 {{ filtered.length }} 条</div>
            <div class="pages">
              <button class="page-btn"><i class="fas fa-chevron-left"></i></button>
              <button class="page-btn active">1</button>
              <button class="page-btn">2</button>
              <button class="page-btn"><i class="fas fa-chevron-right"></i></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/vue@3.4.21/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus@2.7.0/dist/index.full.min.js"></script>
<script>
const{createApp,ref,reactive,computed}=Vue;
createApp({
  setup(){
    const sidebarOpen=ref(false);
    const keyword=ref('');
    const records=reactive([
      {id:1,description:'城市夜景照片，高楼大厦林立，霓虹灯光映照在湿润的路面上，营造出梦幻般的氛围',tags:['城市','夜景','霓虹灯','建筑','雨天'],status:'SUCCESS',createdAt:'2026-05-10 14:50'},
      {id:2,description:'一张展示春天花园的照片，粉色樱花盛开，蜜蜂在花间飞舞，阳光透过花瓣',tags:['春天','樱花','花园','蜜蜂','阳光'],status:'SUCCESS',createdAt:'2026-05-10 11:20'},
      {id:3,description:'现代简约风格的客厅室内设计，大面积落地窗，灰色沙发搭配木质茶几',tags:['室内设计','客厅','简约','现代'],status:'SUCCESS',createdAt:'2026-05-09 16:35'},
      {id:4,description:'美食摄影，精致的日式料理摆盘，三文鱼刺身搭配芥末和酱油',tags:['美食','日料','刺身','摆盘'],status:'SUCCESS',createdAt:'2026-05-09 10:15'},
      {id:5,description:'山间溪流风景照，清澈的溪水从岩石间流过，周围是翠绿的森林',tags:['风景','溪流','森林','自然','山'],status:'SUCCESS',createdAt:'2026-05-08 15:40'}
    ]);
    const filtered=computed(()=>records.filter(r=>!keyword.value||r.description.includes(keyword.value)));
    const viewDetail=(r)=>{ElementPlus.ElMessage.info('查看详情');};
    const editDesc=(r)=>{ElementPlus.ElMessage.info('编辑描述');};
    const confirmDelete=(r)=>{
      ElementPlus.ElMessageBox.confirm('确定删除这条分析记录吗？','删除确认',{confirmButtonText:'删除',cancelButtonText:'取消',type:'warning'}).then(()=>{
        const idx=records.findIndex(x=>x.id===r.id);
        if(idx>-1)records.splice(idx,1);
        ElementPlus.ElMessage.success('已删除');
      }).catch(()=>{});
    };
    return{sidebarOpen,keyword,records,filtered,viewDetail,editDesc,confirmDelete};
  }
}).use(ElementPlus).mount('#app');
</script>
</body>
</html>
