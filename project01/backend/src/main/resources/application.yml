server:
  port: 8080

spring:
  profiles:
    active: h2
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      table-format: "`%s`"

jwt:
  secret: ${JWT_SECRET:nebula-studio-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long}
  expiration: 86400000

ai:
  text2image:
    provider: local-model
  image2text:
    provider: qwen
  local-model:
    enabled: true
    api-url: http://127.0.0.1:5000
    model-dir: ../sd-models
    timeout: 300

storage:
  local:
    enabled: true
    path: ./uploads
    url-prefix: /uploads/
  model:
    path: ../output/models

logging:
  level:
    com.nebula.studio: DEBUG
    com.baomidou.mybatisplus: WARN
    org.apache.ibatis: WARN

---
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:file:./data/nebula_studio;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
      continue-on-error: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/nebula_studio?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
