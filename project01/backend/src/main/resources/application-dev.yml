server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:nebula_studio;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      schema-locations: classpath:h2-schema.sql
      encoding: UTF-8
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      table-format: "`%s`"

jwt:
  secret: nebula-studio-secret-key-for-jwt-token-generation-must-be-at-least-256-bits-long
  expiration: 86400000

logging:
  level:
    com.nebula.studio: DEBUG
